name: Improvement
description: Suggest an improvement to existing functionality
title: "[Improvement]: "
labels: ["enhancement", "improvement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Help us understand what could be better.

  - type: input
    id: component
    attributes:
      label: Component or Feature
      description: Which component or feature needs improvement?
      placeholder: "Example: User authentication, Dashboard UI, API performance"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: Describe how the feature currently works
      placeholder: Explain the current implementation and what aspects need improvement
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Improvement
      description: Describe your proposed improvement
      placeholder: Explain specifically what you'd like to see improved and why
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: What are the benefits of this improvement?
      placeholder: |
        - Better performance
        - Improved user experience
        - Easier maintenance
        - etc.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Improvement Category
      description: What type of improvement is this?
      options:
        - Performance
        - User Experience (UX)
        - Developer Experience (DX)
        - Accessibility
        - Security
        - Documentation
        - Code Quality
        - Testing
        - Other
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: Do you have ideas on how to implement this improvement?
      placeholder: Share technical approaches, code examples, or implementation strategies

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: What's the expected impact of this improvement?
      options:
        - High - Significant user or system benefit
        - Medium - Noticeable improvement
        - Low - Minor enhancement
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking Changes
      description: Would this improvement introduce breaking changes?
      options:
        - label: This improvement would introduce breaking changes
        - label: This improvement is backward compatible

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the improvement
      placeholder: Benchmarks, user feedback, related issues, etc.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
